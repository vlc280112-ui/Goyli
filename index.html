<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Goyli 🐻👑</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}

body{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(135deg,#a78bfa,#60a5fa,#67e8f9,#f9a8d4);
  padding:20px;
}

.app{
  width:100%;
  max-width:420px;
  background:rgba(255,255,255,.95);
  border-radius:30px;
  padding:30px 24px;
  text-align:center;
  box-shadow:0 15px 40px rgba(0,0,0,.18);
}

.bear{font-size:80px}
.crown{font-size:35px}
h1{font-size:42px;color:#6d28d9;margin:8px}
.subtitle{color:#666;margin-bottom:25px}

.input{
  width:100%;
  padding:16px;
  margin:8px 0;
  border:2px solid #ddd;
  border-radius:18px;
  font-size:16px;
}

.login{
  width:100%;
  padding:16px;
  margin-top:15px;
  border:0;
  border-radius:18px;
  background:linear-gradient(90deg,#8b5cf6,#ec4899);
  color:white;
  font-size:18px;
  font-weight:bold;
}

.dark{
  margin-top:18px;
  border:0;
  background:#eee;
  padding:10px 15px;
  border-radius:15px;
}

.error{
  color:#dc2626;
  margin-top:12px;
  font-size:14px;
}

#inicio{display:none}

.menu{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:20px;
}

.menu button{
  padding:15px;
  border:0;
  border-radius:18px;
  font-size:16px;
  background:#f3e8ff;
}

.logout{
  margin-top:20px;
  padding:12px 20px;
  border:0;
  border-radius:15px;
  background:#fee2e2;
}

body.modo-oscuro{
  background:linear-gradient(135deg,#171329,#172554,#164e63);
}

.modo-oscuro .app{
  background:#202033;
  color:white;
}

.modo-oscuro .subtitle{
  color:#ccc;
}

.modo-oscuro .input{
  background:#303047;
  color:white;
  border-color:#555;
}

.modo-oscuro .dark{
  background:#444;
  color:white;
}

.modo-oscuro .menu button{
  background:#34304d;
  color:white;
}
</style>
</head>

<body>

<div class="app" id="login">
  <div class="crown">👑</div>
  <div class="bear">🐻</div>

  <h1>Goyli</h1>
  <p class="subtitle">Tu espacio de clase 💙</p>

  <input id="email" class="input" type="email"
    placeholder="📧 Correo electrónico">

  <input id="password" class="input" type="password"
    placeholder="🔑 Contraseña">

  <button class="login" onclick="entrar()">
    Entrar 🚀
  </button>

  <p id="error" class="error"></p>

  <button class="dark" onclick="modoOscuro()">
    🌙 Modo oscuro
  </button>
</div>

<div class="app" id="inicio">
  <div class="crown">👑</div>
  <div class="bear">🐻</div>

  <h1>¡Hola! 👋</h1>
  <p class="subtitle">Bienvenido a Goyli 💙</p>

  <div class="menu">
    <button>🏠 Inicio</button>
    <button>📚 Materias</button>
    <button>💬 Chat</button>
    <button>📢 Avisos</button>
    <button>🔔 Notificaciones</button>
    <button>📅 Calendario</button>
    <button>👤 Perfil</button>
    <button>👑 Admin</button>
  </div>

  <button class="logout" onclick="salir()">
    Cerrar sesión 🚪
  </button>

  <button class="dark" onclick="modoOscuro()">
    🌙 Modo oscuro
  </button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://muwrlnzphjkhzsewuges.supabase.co";
const SUPABASE_KEY = "sb_publishable_C3oaqdeVudp4zyUL071CrQ_XnyB1XLm";

const supabaseClient = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

async function entrar(){
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  const error = document.getElementById("error");

  error.textContent = "";

  const {error: loginError} =
    await supabaseClient.auth.signInWithPassword({
      email: email,
      password: password
    });

  if(loginError){
    error.textContent = "No se pudo iniciar sesión. Revisa tus datos.";
    return;
  }

  mostrarInicio();
}

async function salir(){
  await supabaseClient.auth.signOut();
  document.getElementById("inicio").style.display="none";
  document.getElementById("login").style.display="block";
}

function mostrarInicio(){
  document.getElementById("login").style.display="none";
  document.getElementById("inicio").style.display="block";
}

function modoOscuro(){
  document.body.classList.toggle("modo-oscuro");
}

supabaseClient.auth.getSession().then(({data})=>{
  if(data.session){
    mostrarInicio();
  }
});
</script>

</body>
  </html>
