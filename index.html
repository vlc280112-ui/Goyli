<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Goyli 🐻👑</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(135deg,#a78bfa,#60a5fa,#67e8f9,#f9a8d4);
  padding:20px;
}

.app{
  width:100%;
  max-width:420px;
  background:rgba(255,255,255,.94);
  border-radius:30px;
  padding:30px 24px;
  text-align:center;
  box-shadow:0 15px 40px rgba(0,0,0,.18);
}

.bear{
  font-size:90px;
  margin-bottom:5px;
}

.crown{
  font-size:35px;
  margin-bottom:5px;
}

h1{
  font-size:42px;
  color:#6d28d9;
  margin-bottom:5px;
}

.subtitle{
  color:#666;
  margin-bottom:25px;
  font-size:16px;
}

.input{
  width:100%;
  padding:16px;
  margin:8px 0;
  border:2px solid #ddd;
  border-radius:18px;
  font-size:16px;
  outline:none;
}

.input:focus{
  border-color:#8b5cf6;
}

.login{
  width:100%;
  padding:16px;
  margin-top:15px;
  border:none;
  border-radius:18px;
  background:linear-gradient(90deg,#8b5cf6,#ec4899);
  color:white;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
}

.login:active{
  transform:scale(.98);
}

.info{
  margin-top:20px;
  font-size:13px;
  color:#777;
}

.dark{
  margin-top:18px;
  border:none;
  background:#eee;
  padding:10px 15px;
  border-radius:15px;
  cursor:pointer;
}

body.modo-oscuro{
  background:linear-gradient(135deg,#171329,#172554,#164e63);
}

.modo-oscuro .app{
  background:#202033;
  color:white;
}

.modo-oscuro .subtitle,
.modo-oscuro .info{
  color:#ccc;
}

.modo-oscuro .input{
  background:#303047;
  color:white;
  border-color:#555;
}

.modo-oscuro .dark{
  background:#444;
  color:white;
}
</style>
</head>

<body>

<div class="app">

  <div class="crown">👑</div>
  <div class="bear">🐻</div>

  <h1>Goyli</h1>
  <p class="subtitle">Tu espacio de clase 💙</p>

  <input
    class="input"
    type="email"
    placeholder="📧 Correo electrónico"
  >

  <input
    class="input"
    type="password"
    placeholder="🔑 Contraseña"
  >

  <button class="login" onclick="entrar()">
    Entrar 🚀
  </button>

  <p class="info">
    🔐 Solo pueden entrar usuarios invitados.
  </p>

  <button class="dark" onclick="modoOscuro()">
    🌙 Modo oscuro
  </button>

</div>

<script>
function entrar(){
  alert("¡Bienvenido a Goyli! 🐻👑");
}

function modoOscuro(){
  document.body.classList.toggle("modo-oscuro");
}
</script>

</body>
</html>
